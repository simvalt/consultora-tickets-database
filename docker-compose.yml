# PostgreSQL local + job de migraciones. Uso: docker compose up -d db && docker compose run --rm migrate
services:
  db:
    image: postgres:16.15-bookworm
    restart: unless-stopped  # vuelve a levantarse tras reiniciar el servidor o Docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tickets}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tickets}
      APP_ENV: ${APP_ENV:-local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}

volumes:
  pgdata:
